[workspace]
members = [".", "demo/wasm"]

[package]
name = "mascii"
version = "0.1.0"
edition = "2024"
description = "LyX-like interactive TUI math editor rendering Unicode/ASCII-art formulas"
license = "MIT"

[features]
default = ["tui"]
# The TUI binary; the library (AST/render/parse/editor) has no TUI deps,
# so wasm builds use default-features = false.
tui = ["dep:ratatui", "dep:arboard"]

[dependencies]
# Compile-time perfect hash for the generated symbol table: no ordering
# invariant to break by hand, and duplicate names fail the build.
phf = { version = "0.14", features = ["macros"] }
ratatui = { version = "0.30", optional = true }
arboard = { version = "3", optional = true }

[[bin]]
name = "mascii"
required-features = ["tui"]
