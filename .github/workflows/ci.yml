name: ci
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 18 * * *"

# Actions are pinned to commit SHAs, not tags: a tag is a moving
# pointer the action's owner can repoint at any time, and these run
# with a token in a repository we push to. The comment says which
# release each SHA is, so a bump is a readable diff.
#
# dtolnay/rust-toolchain takes its channel from the `toolchain` input
# (defaulting to stable), so pinning the ref does not change which
# toolchain is installed — it is spelled out anyway, because the ref no
# longer says it.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo check --no-default-features --target wasm32-unknown-unknown

  fuzz-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: FORMULAA_PROP_N=50000 FORMULAA_UI_PROP_N=5000 cargo test --release
